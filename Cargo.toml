[package]
name = "tp1_andrea_figueroa_r"
version = "0.1.0"
edition = "2024"

[lib]
name = "steam_reviews"
path = "src/lib.rs"

[dependencies]
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
csv = "1.1"
serde_json = "1.0"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "point_series"] }
memchr = "2"

[[bin]]
name = "tp1-AndreaFigueroaR"
path = "./src/main.rs"

[[bin]]
name = "charts"
path = "./src/bin/charts.rs"

[[bin]]
name = "scaling"
path = "./src/bin/scaling.rs"

[profile.release]
codegen-units = 1
lto = "fat"
